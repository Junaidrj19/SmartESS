[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartess"
version = "0.1.0"
description = "SmartESS — configurable SiC MOSFET reliability-intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jsonschema>=4.22",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
addopts = "-q"
